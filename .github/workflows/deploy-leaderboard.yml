name: Classement (Cloudflare)

# Déploie le classement de la Descente du jour (server/) sur Cloudflare Workers + D1.
# Secrets à ajouter dans Settings > Secrets and variables > Actions (les mêmes que pour Spare) :
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Code Discord du jour (facultatif) : DISCORD_WEBHOOK_URL (Paramètres du serveur > Intégrations >
#   Webhooks : webhook d'un salon réservé aux membres).
# La base D1 « lanterne-classement » est créée au premier passage. L'adresse du Worker est
# écrite dans leaderboard.url à la racine du dépôt : le jeu la lit pour trouver le classement.

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-leaderboard.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Vérifier les secrets Cloudflare
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::warning::Ajoute CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID dans Settings > Secrets and variables > Actions (les mêmes que pour Spare), puis relance ce workflow."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Tests du Worker
        if: steps.check.outputs.ready == 'true'
        working-directory: server
        run: node test_worker.mjs

      - name: Base D1 (créée au premier passage)
        if: steps.check.outputs.ready == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          find_id() {
            npx --yes wrangler@4 d1 list --json 2>/dev/null | node -e '
              let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
                try { const db = JSON.parse(s).find(x => x.name === "lanterne-classement"); process.stdout.write(db ? db.uuid : ""); }
                catch (e) { process.stdout.write(""); }
              });'
          }
          ID="$(find_id)"
          if [ -z "$ID" ]; then
            npx --yes wrangler@4 d1 create lanterne-classement
            ID="$(find_id)"
          fi
          if [ -z "$ID" ]; then echo "::error::Base D1 introuvable"; exit 1; fi
          sed -i "s/D1_DATABASE_ID_PLACEHOLDER/$ID/" wrangler.toml
          npx --yes wrangler@4 d1 execute lanterne-classement --remote --file=schema.sql

      - name: Déployer le Worker
        if: steps.check.outputs.ready == 'true'
        id: deploy
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy | tee deploy.log
          URL="$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)"
          if [ -z "$URL" ]; then echo "::error::Adresse du Worker introuvable"; exit 1; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          # une adresse workers.dev neuve peut mettre une à deux minutes à répondre
          for i in $(seq 1 24); do
            if curl -fsS "$URL/health"; then echo; exit 0; fi
            sleep 5
          done
          echo "::warning::$URL ne répond pas encore (propagation workers.dev) ; l'adresse est publiée quand même."

      - name: Webhook Discord (code du jour du familier « Tube néon »)
        if: steps.check.outputs.ready == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::Ajoute DISCORD_WEBHOOK_URL (webhook d'un salon de ton serveur Discord) dans Settings > Secrets and variables > Actions pour activer le code du jour."
            exit 0
          fi
          printf '%s' "$HOOK" | npx --yes wrangler@4 secret put DISCORD_WEBHOOK_URL

      - name: Publier l'adresse pour le jeu (leaderboard.url)
        if: steps.check.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          if [ "$(cat leaderboard.url 2>/dev/null)" != "$URL" ]; then
            printf '%s\n' "$URL" > leaderboard.url
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add leaderboard.url
            git commit -m "Adresse du classement : $URL"
            git push
          fi
