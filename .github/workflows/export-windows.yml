# Construit le jeu pour Windows (.exe), Linux / Steam Deck (.x86_64) et macOS (.app universelle) automatiquement.
# - À chaque Release publiée (ou tag « v* ») : ajoute LanterneDesProfondeurs_Windows.zip à la Release.
# - Lancement manuel (onglet Actions > Export Windows > Run workflow) :
#     * champ « version » rempli (ex. v1.2.0) → crée le tag et la Release avec l'exe ;
#     * champ vide → exe disponible seulement dans les artefacts.
name: Export Windows

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. v1.2.0). Laisser vide pour un simple test."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Après la bascule vers Steam (fichier PUBLIC_DEMO à la racine, voir docs/steam/bascule.md),
      # les versions publiques gratuites sont la démo.
      - name: Édition publique
        run: |
          if [ -f PUBLIC_DEMO ]; then
            sed -i 's/^const DEMO := .*/const DEMO := true/' scripts/edition.gd
            echo "Édition : démo"
          else
            echo "Édition : jeu complet"
          fi

      - name: Installer Godot 4.3 et les modèles d'export Windows, Linux et macOS
        run: |
          cd "$RUNNER_TEMP"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          mv Godot_v4.3-stable_linux.x86_64 godot && chmod +x godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -qj Godot_v4.3-stable_export_templates.tpz templates/windows_release_x86_64.exe templates/linux_release.x86_64 templates/macos.zip templates/version.txt \
            -d ~/.local/share/godot/export_templates/4.3.stable
          rm Godot_v4.3-stable_export_templates.tpz

      # La version du jeu vient du tag : elle est écrite dans le projet avant l'export
      # (le jeu la compare à la dernière Release pour se mettre à jour, voir scripts/updater.gd).
      - name: Numéro de version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          V="$INPUT_VERSION"
          [ -z "$V" ] && V="$RELEASE_TAG"
          if [ -z "$V" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then V="$GITHUB_REF_NAME"; fi
          V="${V#v}"
          if echo "$V" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            sed -i "s/^const VERSION := .*/const VERSION := \"$V\"/" scripts/version.gd
            sed -i "s/^config\/version=.*/config\/version=\"$V\"/" project.godot
            sed -i -E "s/(file_version|product_version)=\"[^\"]*\"/\1=\"$V.0\"/; s/(short_version|application\/version)=\"[^\"]*\"/\1=\"$V\"/" export_presets.cfg
            echo "Version : $V"
          else
            echo "Pas de version (ou format inattendu : '$V') : valeurs du dépôt conservées."
          fi
          grep VERSION scripts/version.gd

      - name: Importer et exporter
        run: |
          "$RUNNER_TEMP/godot" --headless --editor --quit || true
          mkdir -p build
          # Patch de mise à jour automatique : scripts, shaders et scènes seulement (quelques centaines de Ko).
          # Son nom contient la version du moteur et la « génération » des données (config/data_gen).
          GEN=$(sed -n 's/^config\/data_gen=//p' project.godot)
          "$RUNNER_TEMP/godot" --headless --export-pack "Patch" "build/LanterneDesProfondeurs_patch_g4.3_d${GEN:-1}.pck"
          "$RUNNER_TEMP/godot" --headless --export-release "Windows Desktop" build/LanterneDesProfondeurs.exe
          pip install --quiet pillow
          python3 tools/peicon.py build/LanterneDesProfondeurs.exe art/icon_1024.png
          mkdir -p build/linux
          "$RUNNER_TEMP/godot" --headless --export-release "Linux" build/linux/LanterneDesProfondeurs.x86_64
          cp art/icon.png build/linux/LanterneDesProfondeurs.png
          tar -czf build/LanterneDesProfondeurs_Linux_SteamDeck.tar.gz -C build/linux .
          # Versions portables : portable.txt à côté du jeu = sauvegardes dans le dossier du jeu
          P=build/portable
          mkdir -p $P/win/LanterneDesProfondeurs_Portable/sauvegardes $P/linux/LanterneDesProfondeurs_Portable/sauvegardes
          cp build/LanterneDesProfondeurs.exe art/portable.txt $P/win/LanterneDesProfondeurs_Portable/
          cp build/linux/LanterneDesProfondeurs.x86_64 build/linux/LanterneDesProfondeurs.png art/portable.txt $P/linux/LanterneDesProfondeurs_Portable/
          (cd $P/win && zip -9 -r ../../LanterneDesProfondeurs_Windows_Portable.zip LanterneDesProfondeurs_Portable)
          tar -czf build/LanterneDesProfondeurs_Linux_Portable.tar.gz -C $P/linux LanterneDesProfondeurs_Portable
          # macOS : application universelle (Intel + Apple Silicon), signature ad hoc (non validée par Apple)
          mkdir -p build/macos
          "$RUNNER_TEMP/godot" --headless --export-release "macOS" build/macos/LanterneDesProfondeurs.zip
          cp build/macos/LanterneDesProfondeurs.zip build/LanterneDesProfondeurs_macOS.zip
          cd build && zip -9 LanterneDesProfondeurs_Windows.zip LanterneDesProfondeurs.exe

      - name: Artefact
        uses: actions/upload-artifact@v6
        with:
          name: LanterneDesProfondeurs
          path: |
            build/LanterneDesProfondeurs_Windows.zip
            build/LanterneDesProfondeurs_Linux_SteamDeck.tar.gz
            build/LanterneDesProfondeurs_Windows_Portable.zip
            build/LanterneDesProfondeurs_Linux_Portable.tar.gz
            build/LanterneDesProfondeurs_macOS.zip
            build/LanterneDesProfondeurs_patch_*.pck

      - name: Release (tag ou Release publiée)
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/LanterneDesProfondeurs_Windows.zip
            build/LanterneDesProfondeurs_Linux_SteamDeck.tar.gz
            build/LanterneDesProfondeurs_Windows_Portable.zip
            build/LanterneDesProfondeurs_Linux_Portable.tar.gz
            build/LanterneDesProfondeurs_macOS.zip
            build/LanterneDesProfondeurs_patch_*.pck

      - name: Release (lancement manuel avec version)
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: Lanterne des Profondeurs ${{ inputs.version }}
          generate_release_notes: true
          body: |
            **Windows** : télécharger `LanterneDesProfondeurs_Windows.zip`, décompresser et lancer `LanterneDesProfondeurs.exe`.
            L'exe n'est pas encore signé : si Windows affiche « Windows a protégé votre ordinateur », cliquer *Informations complémentaires* → *Exécuter quand même*.

            **Version portable** (clé USB, sauvegardes à côté du jeu) : `LanterneDesProfondeurs_Windows_Portable.zip` ou `LanterneDesProfondeurs_Linux_Portable.tar.gz`.

            **Linux / Steam Deck** : télécharger `LanterneDesProfondeurs_Linux_SteamDeck.tar.gz`, extraire, lancer `LanterneDesProfondeurs.x86_64` (voir le README pour l'ajouter à Steam).

            **macOS** (Intel et Apple Silicon) : télécharger `LanterneDesProfondeurs_macOS.zip`, décompresser, glisser *Lanterne des Profondeurs* dans Applications.
            L'app n'est pas validée par Apple : au premier lancement, faire **clic droit → Ouvrir** puis **Ouvrir**
            (sur macOS 15 : Réglages Système → Confidentialité et sécurité → « Ouvrir quand même »).
            Si macOS dit que l'app est « endommagée » : dans le Terminal, `xattr -cr "/Applications/Lanterne des Profondeurs.app"`.
          files: |
            build/LanterneDesProfondeurs_Windows.zip
            build/LanterneDesProfondeurs_Linux_SteamDeck.tar.gz
            build/LanterneDesProfondeurs_Windows_Portable.zip
            build/LanterneDesProfondeurs_Linux_Portable.tar.gz
            build/LanterneDesProfondeurs_macOS.zip
            build/LanterneDesProfondeurs_patch_*.pck
