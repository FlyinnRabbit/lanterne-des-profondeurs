# Construit l'exe Windows automatiquement.
# - À chaque tag « v* » (ex. v1.0.0) : publie LanterneDesProfondeurs_Windows.zip dans une Release GitHub.
# - Lancement manuel possible (onglet Actions > Export Windows > Run workflow) : exe dans les artefacts.
name: Export Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Godot 4.3 et le modèle d'export Windows
        run: |
          cd "$RUNNER_TEMP"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          mv Godot_v4.3-stable_linux.x86_64 godot && chmod +x godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -qj Godot_v4.3-stable_export_templates.tpz templates/windows_release_x86_64.exe templates/version.txt \
            -d ~/.local/share/godot/export_templates/4.3.stable
          rm Godot_v4.3-stable_export_templates.tpz

      - name: Importer et exporter
        run: |
          "$RUNNER_TEMP/godot" --headless --editor --quit || true
          mkdir -p build
          "$RUNNER_TEMP/godot" --headless --export-release "Windows Desktop" build/LanterneDesProfondeurs.exe
          cd build && zip -9 LanterneDesProfondeurs_Windows.zip LanterneDesProfondeurs.exe

      - name: Artefact
        uses: actions/upload-artifact@v4
        with:
          name: LanterneDesProfondeurs_Windows
          path: build/LanterneDesProfondeurs_Windows.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/LanterneDesProfondeurs_Windows.zip
          generate_release_notes: true
